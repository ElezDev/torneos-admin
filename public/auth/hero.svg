<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3d2e"/>
      <stop offset="45%" stop-color="#146b45"/>
      <stop offset="100%" stop-color="#1faa5c"/>
    </linearGradient>
    <linearGradient id="light" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f4f7f2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f4f7f2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="turf" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 48L48 0M-12 12L12 -12M36 60L60 36" stroke="#0a3326" stroke-opacity="0.12" stroke-width="8"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" fill="url(#turf)"/>
  <rect width="1440" height="900" fill="url(#light)"/>
  <!-- pitch -->
  <g transform="translate(180 120)" stroke="#e8f5ee" stroke-opacity="0.55" fill="none">
    <rect x="0" y="0" width="1080" height="660" rx="8" stroke-width="4"/>
    <line x1="540" y1="0" x2="540" y2="660" stroke-width="3"/>
    <circle cx="540" cy="330" r="90" stroke-width="3"/>
    <circle cx="540" cy="330" r="6" fill="#e8f5ee" stroke="none" fill-opacity="0.7"/>
    <rect x="0" y="195" width="140" height="270" stroke-width="3"/>
    <rect x="940" y="195" width="140" height="270" stroke-width="3"/>
    <rect x="0" y="245" width="55" height="170" stroke-width="2.5"/>
    <rect x="1025" y="245" width="55" height="170" stroke-width="2.5"/>
    <path d="M140 270 A70 70 0 0 0 140 390" stroke-width="2.5"/>
    <path d="M940 270 A70 70 0 0 1 940 390" stroke-width="2.5"/>
  </g>
  <!-- soft vignette shapes -->
  <circle cx="120" cy="780" r="220" fill="#06281d" fill-opacity="0.28"/>
  <circle cx="1320" cy="80" r="260" fill="#f7fffb" fill-opacity="0.08"/>
